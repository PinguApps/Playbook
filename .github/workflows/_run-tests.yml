name: Run Tests

on:
  workflow_call:
    inputs:
      smoke:
        description: Run only the installed MCP smoke test; releases always use full validation.
        type: boolean
        default: false
      package_version:
        type: string
        default: 0.0.0-ci
      checkout_ref:
        type: string
        default: ''
      release_ready:
        type: boolean
        default: false
      publish_test_results_to_github:
        type: boolean
        default: false
      publish_test_results_comment_mode:
        type: string
        default: 'off'
      publish_test_results_check_name:
        type: string
        default: Test Results
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build and verify package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.smoke && !inputs.release_ready && 5 || 15 }}
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-ci' }}
      RELEASE_READY: ${{ inputs.release_ready || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup sample SDKs for full validation
        if: '!inputs.smoke || inputs.release_ready'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            9.0.319
            11.0.100-rc.2.26504.105

      - name: Identify dependency policy changes
        id: dependency_changes
        if: inputs.smoke && !inputs.release_ready && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $gh = (Get-Command gh -CommandType Application).Source
          $files = @(& $gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if (-not $files.Count) { throw 'Could not identify changed files.' }
          $required = @($files | Where-Object { $_ -match '(^\.github/workflows/|^eng/|^renovate\.json$|^docs/dependency-updates\.md$|(^|/)(Directory\.[^/]+|global\.json|NuGet\.[Cc]onfig|packages\.lock\.json|dotnet-tools\.json)$|\.(csproj|fsproj|vbproj|props|targets|slnx?)$)' }).Count -gt 0
          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify Renovate update permissions
        if: '!inputs.smoke || inputs.release_ready || steps.dependency_changes.outputs.required != ''false'''
        shell: pwsh
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: ./eng/Test-Renovate.ps1 -IsolatedNode

      - name: Compile samples and verify the packed tool
        if: '!inputs.smoke || inputs.release_ready'
        shell: pwsh
        run: ./eng/Verify.ps1 -PackageVersion $env:PACKAGE_VERSION -ReleaseReady:([bool]::Parse($env:RELEASE_READY)) -SkipInstalledTests

      - name: Build pack install list get and shut down once
        if: inputs.smoke && !inputs.release_ready
        shell: pwsh
        run: ./eng/Test-Smoke.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Prepare offline test image
        if: '!inputs.smoke || inputs.release_ready'
        run: |
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:bfabf51e74c5a7cf2fc4eac852145db86f4867d475257d809518d6a2b0fe71e1

      - name: Verify the same package without network or checkout access
        if: '!inputs.smoke || inputs.release_ready'
        shell: pwsh
        run: |
          ./eng/Test-Offline.ps1 -PackageVersion $env:PACKAGE_VERSION -RuntimeMajor 10
          ./eng/Test-Offline.ps1 -PackageVersion $env:PACKAGE_VERSION -RuntimeMajor 11

      - name: Publish test results
        if: (success() || failure()) && inputs.publish_test_results_to_github
        uses: EnricoMi/publish-unit-test-result-action/linux@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        with:
          files: artifacts/TestResults/**/*.trx
          check_name: ${{ inputs.publish_test_results_check_name }}
          comment_mode: ${{ inputs.publish_test_results_comment_mode }}
          job_summary: false

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          '## Test results' >> $env:GITHUB_STEP_SUMMARY
          if (-not $files) { 'No TRX files were produced.' >> $env:GITHUB_STEP_SUMMARY }
          foreach ($file in $files) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName
            $counts = $trx.TestRun.ResultSummary.Counters
            "- $($file.Name): passed $($counts.passed), failed $($counts.failed), skipped $($counts.notExecuted), total $($counts.total)" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path artifacts/package.sha256) { Get-Content artifacts/package.sha256 >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: artifacts/TestResults/
          if-no-files-found: warn

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playbook-package
          path: |
            artifacts/PinguApps.Playbook.${{ env.PACKAGE_VERSION }}.nupkg
            artifacts/package.sha256
          if-no-files-found: error

      - name: Upload the compiled consumer suite
        if: '!inputs.smoke || inputs.release_ready'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playbook-consumer-suite
          path: tests/PinguApps.Playbook.Tests/bin/Release/net10.0/
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }} installed smoke
    if: '!inputs.smoke || inputs.release_ready'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout consumer script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref }}
          sparse-checkout: eng/Test-Package.ps1
          sparse-checkout-cone-mode: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/playbook-dotnet
        with:
          dotnet-version: 10.0.402

      - name: Download the exact packed artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playbook-package
          path: artifacts

      - name: Download the compiled consumer suite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playbook-consumer-suite
          path: suite

      - name: Install initialize list get and shut down once
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-ci' }}
          DOTNET_ROOT: ${{ runner.temp }}/playbook-dotnet
          DOTNET_ROOT_X64: ${{ runner.temp }}/playbook-dotnet
          DOTNET_ROOT_ARM64: ${{ runner.temp }}/playbook-dotnet
        run: ./eng/Test-Package.ps1 -Artifacts ./artifacts -Suite ./suite -PackageVersion $env:PACKAGE_VERSION -Smoke

      - name: Upload smoke results and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-${{ matrix.name }}
          path: artifacts/TestResults/
          if-no-files-found: error

  summary:
    name: Validation time and results
    if: always() && (!inputs.smoke || inputs.release_ready)
    needs: [test, desktop]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Download validation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*results'
          path: evidence

      - name: Download desktop evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-*
          path: evidence

      - name: Report TRX runtime identity and total runner time
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          '## Validation evidence' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem evidence -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $counts = $trx.TestRun.ResultSummary.Counters
            "- $($_.Directory.Name): passed $($counts.passed), failed $($counts.failed), skipped $($counts.notExecuted), total $($counts.total)" >> $env:GITHUB_STEP_SUMMARY
          }
          Get-ChildItem evidence -Recurse -Filter *.json | ForEach-Object {
            $record = Get-Content $_.FullName -Raw | ConvertFrom-Json
            "- $($record.package) SHA-256 $($record.sha256): $($record.coreClr); exit $($record.shutdownExitCode)" >> $env:GITHUB_STEP_SUMMARY
          }
          $pages = gh api "repos/$env:REPOSITORY/actions/runs/$env:RUN_ID/attempts/$env:RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp | ConvertFrom-Json
          $jobs = @($pages.jobs | Where-Object { $_.name -match '(Build and verify package|Windows installed smoke|macOS installed smoke)$' -and $_.completed_at })
          if ($jobs.Count -ne 3) { throw 'Expected timing records for all three validation runners.' }
          $seconds = 0.0
          foreach ($job in $jobs) {
            $duration = ([datetimeoffset]$job.completed_at - [datetimeoffset]$job.started_at).TotalSeconds
            $seconds += $duration
            "- $($job.name): $duration runner seconds ($($job.conclusion))" >> $env:GITHUB_STEP_SUMMARY
          }
          $start = ($jobs | ForEach-Object { [datetimeoffset]$_.started_at } | Sort-Object | Select-Object -First 1)
          $end = ($jobs | ForEach-Object { [datetimeoffset]$_.completed_at } | Sort-Object | Select-Object -Last 1)
          "Elapsed validation: $(($end - $start).TotalSeconds) seconds. Total runner time: $seconds seconds across the three validation jobs (setup/teardown included)." >> $env:GITHUB_STEP_SUMMARY
          'Reporting-job time is excluded. These are execution durations, not a billed-cost estimate; provider rates, discounts and rounding are not inferred. No cost-saving claim is made.' >> $env:GITHUB_STEP_SUMMARY
