name: Run Tests

on:
  workflow_call:
    inputs:
      smoke:
        description: Use PR validation (installed MCP smoke or allowlisted docs checks).
        type: boolean
        default: false
      package_version:
        type: string
        default: 0.0.0-ci
      checkout_ref:
        type: string
        default: ''
      release_ready:
        type: boolean
        default: false
      publish_test_results_to_github:
        type: boolean
        default: false
      publish_test_results_comment_mode:
        type: string
        default: 'off'
      publish_test_results_check_name:
        type: string
        default: Test Results
  workflow_dispatch:
    inputs:
      package_version:
        description: Candidate version to build and validate without publication.
        type: string
        default: 0.0.0-ci
      release_ready:
        description: Enforce the stable or preview evidence gate.
        type: boolean
        default: false
      checkout_ref:
        description: Commit or branch whose exact artifact all lanes consume.
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build and verify package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.smoke && !inputs.release_ready && 10 || 40 }}
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-ci' }}
      RELEASE_READY: ${{ inputs.release_ready || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: ${{ inputs.smoke && !inputs.release_ready && github.event_name == 'pull_request' && 2 || 1 }}

      - name: Classify the checked-out PR merge
        id: scope
        if: inputs.smoke && !inputs.release_ready && github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          $scope = ./eng/Get-PrValidationScope.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -MergeSha $env:MERGE_SHA
          "docs_only=$($scope.DocsOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "policy_required=$($scope.PolicyRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 11 GA SDK
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Setup sample SDKs for full validation
        if: '!inputs.smoke || inputs.release_ready'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            9.0.319
            10.0.403
            11.0.100

      - name: Verify Renovate update permissions
        if: steps.scope.outputs.policy_required != 'false'
        shell: pwsh
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: ./eng/Test-Renovate.ps1 -IsolatedNode

      - name: Check publication guards without credentials
        shell: pwsh
        run: ./eng/Test-Publishing.ps1

      - name: Check dependency inventory for docs-only PRs
        if: steps.scope.outputs.docs_only == 'true'
        shell: pwsh
        run: ./eng/Test-DependencyPolicy.ps1

      - name: Compile samples and verify the packed tool
        if: '!inputs.smoke || inputs.release_ready'
        shell: pwsh
        run: ./eng/Verify.ps1 -PackageVersion $env:PACKAGE_VERSION -ReleaseReady:([bool]::Parse($env:RELEASE_READY)) -SkipInstalledTests

      - name: Build pack install list get and shut down once
        if: inputs.smoke && !inputs.release_ready && steps.scope.outputs.docs_only != 'true'
        shell: pwsh
        run: ./eng/Test-Smoke.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Prepare offline test image
        if: '!inputs.smoke || inputs.release_ready'
        run: |
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:65f3c7c6a25a239ab3e6719f2896147e7b68242ff2d8818dd70498bde6ef8bea
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
          docker pull mcr.microsoft.com/dotnet/sdk@sha256:52556c0fb9d0f609ae9aeab9efeeba96f4acc2f7038f7696f2235ccbdbb8e290

      - name: Verify the same package without network or checkout access
        if: '!inputs.smoke || inputs.release_ready'
        shell: pwsh
        run: |
          ./eng/Test-Offline.ps1 -PackageVersion $env:PACKAGE_VERSION -RuntimeMajor 11
          ./eng/Test-Offline.ps1 -PackageVersion $env:PACKAGE_VERSION -Mode Bundled
          ./eng/Test-Offline.ps1 -PackageVersion $env:PACKAGE_VERSION -Mode Fallback

      - name: Publish test results
        if: (success() || failure()) && inputs.publish_test_results_to_github && steps.scope.outputs.docs_only != 'true'
        uses: EnricoMi/publish-unit-test-result-action/linux@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: artifacts/TestResults/**/*.trx
          check_name: ${{ inputs.publish_test_results_check_name }}
          comment_mode: ${{ inputs.publish_test_results_comment_mode }}
          job_summary: false

      - name: Report docs validation under the PR results check
        if: (success() || failure()) && inputs.publish_test_results_to_github && steps.scope.outputs.docs_only == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: ${{ inputs.publish_test_results_check_name }}
          GUARD_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $gh = (Get-Command gh -CommandType Application | Select-Object -First 1).Source
          & $gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST `
            -f "name=$env:CHECK_NAME" -f "head_sha=$env:PR_HEAD_SHA" -f status=completed `
            -f "conclusion=$env:GUARD_STATUS" -f 'output[title]=Docs-only validation' `
            -f "output[summary]=Publication guards and dependency inventory: $env:GUARD_STATUS. The verified merge changes only allowlisted unserved paths." `
            -f "details_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          '## Test results' >> $env:GITHUB_STEP_SUMMARY
          if (-not $files) { 'No TRX files were produced.' >> $env:GITHUB_STEP_SUMMARY }
          foreach ($file in $files) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName
            $counts = $trx.TestRun.ResultSummary.Counters
            "- $($file.Name): passed $($counts.passed), failed $($counts.failed), skipped $($counts.notExecuted), total $($counts.total)" >> $env:GITHUB_STEP_SUMMARY
          }
          $manifest = "artifacts/packages/$env:PACKAGE_VERSION/package.sha256"
          if (Test-Path $manifest) { Get-Content $manifest >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload test results
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: artifacts/TestResults/
          if-no-files-found: warn

      - name: Upload verified package set
        if: '!inputs.smoke || inputs.release_ready'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playbook-package
          path: |
            artifacts/packages/${{ env.PACKAGE_VERSION }}/*.nupkg
            artifacts/packages/${{ env.PACKAGE_VERSION }}/package.sha256
          if-no-files-found: error

  native-smoke:
    name: ${{ matrix.rid }} installed smoke
    if: '!inputs.smoke || inputs.release_ready'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: blacksmith-2vcpu-windows-2025
          - rid: win-arm64
            os: windows-11-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: blacksmith-6vcpu-macos-15
          - rid: linux-arm64
            os: blacksmith-2vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
    steps:
      - name: Checkout consumer scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref }}
          sparse-checkout: |
            eng/Test-BundledTool.ps1
            eng/Assert-PublishPackage.ps1
          sparse-checkout-cone-mode: false

      - name: Install pinned .NET 10 SDK into an isolated directory
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/playbook-dotnet
        with:
          dotnet-version: 10.0.404

      - name: Download the exact packed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playbook-package
          path: artifacts

      - name: Verify the selected payload and initialize MCP
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-ci' }}
          EXPECTED_RID: ${{ matrix.rid }}
        run: |
          $dotnet = Join-Path $env:RUNNER_TEMP "playbook-dotnet/$(if ($IsWindows) { 'dotnet.exe' } else { 'dotnet' })"
          $options = @{}
          $appHostPacks = @{
            'win-arm64' = @('win-x64', '41D6989224D9E273880072041C0FA7A2D8C92F1CF11E989E8967D3D589A066AD')
            'osx-arm64' = @('osx-x64', '6B00DC51FCDDE7A1B318C15B63FCAC8937F0C02CCF6960115F71B51920285EFE')
          }
          if ($appHostPacks.ContainsKey($env:EXPECTED_RID)) {
            # The SDK resolves an x64 shim template for tools/any even when it
            # will use the bundled executable directly. Supply it offline.
            $hostRid, $hash = $appHostPacks[$env:EXPECTED_RID]
            $id = "microsoft.netcore.app.host.$hostRid"
            $file = "$id.10.0.15.nupkg"
            $installerFeed = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'playbook-installer-feed')
            $destination = Join-Path $installerFeed.FullName $file
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$id/10.0.15/$file" -OutFile $destination
            if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash -cne $hash) { throw "Hash mismatch for $file." }
            $options.InstallerFeed = $installerFeed.FullName
          }
          ./eng/Test-BundledTool.ps1 -Artifacts ./artifacts -PackageVersion $env:PACKAGE_VERSION -Results ./artifacts/TestResults -Dotnet $dotnet -ExpectedRid $env:EXPECTED_RID @options

      - name: Upload smoke results and runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-${{ matrix.rid }}
          path: artifacts/TestResults/
          if-no-files-found: error

  summary:
    name: Validation time and results
    if: always() && (!inputs.smoke || inputs.release_ready)
    needs: [test, native-smoke]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Download validation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*results'
          path: evidence

      - name: Download native smoke evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-*
          path: evidence

      - name: Report TRX runtime identity and total runner time
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          '## Validation evidence' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem evidence -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $counts = $trx.TestRun.ResultSummary.Counters
            "- $($_.Directory.Name): passed $($counts.passed), failed $($counts.failed), skipped $($counts.notExecuted), total $($counts.total)" >> $env:GITHUB_STEP_SUMMARY
          }
          Get-ChildItem evidence -Recurse -Filter *.json | ForEach-Object {
            $record = Get-Content $_.FullName -Raw | ConvertFrom-Json
            "- $($record.package) SHA-256 $($record.sha256): $($record.coreClr); exit $($record.shutdownExitCode)" >> $env:GITHUB_STEP_SUMMARY
          }
          $pages = gh api "repos/$env:REPOSITORY/actions/runs/$env:RUN_ID/attempts/$env:RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp | ConvertFrom-Json
          $jobs = @($pages.jobs | Where-Object { $_.name -match '(Build and verify package|(?:win|osx|linux)-(?:x64|arm64) installed smoke)$' -and $_.completed_at })
          if ($jobs.Count -ne 6) { throw 'Expected timing records for the package builder and five native smoke runners.' }
          $seconds = 0.0
          foreach ($job in $jobs) {
            $duration = ([datetimeoffset]$job.completed_at - [datetimeoffset]$job.started_at).TotalSeconds
            $seconds += $duration
            "- $($job.name): $duration runner seconds ($($job.conclusion))" >> $env:GITHUB_STEP_SUMMARY
          }
          $start = ($jobs | ForEach-Object { [datetimeoffset]$_.started_at } | Sort-Object | Select-Object -First 1)
          $end = ($jobs | ForEach-Object { [datetimeoffset]$_.completed_at } | Sort-Object | Select-Object -Last 1)
          "Elapsed validation: $(($end - $start).TotalSeconds) seconds. Total runner time: $seconds seconds across the six validation jobs (setup/teardown included)." >> $env:GITHUB_STEP_SUMMARY
          'Reporting-job time is excluded. These are execution durations, not a billed-cost estimate; provider rates, discounts and rounding are not inferred. No cost-saving claim is made.' >> $env:GITHUB_STEP_SUMMARY
