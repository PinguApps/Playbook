name: Auto Labeller

on:
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  labelling:
    name: Labelling
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # This workflow never checks out or executes pull-request code.
      - uses: harupy/auto-labeling@937d558e37285af6ca5c5813a826cf6f0d66bf0f # master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-pattern: '- \[(.*?)\] ?`(.+?)`'
