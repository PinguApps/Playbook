name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Start the stable channel at 1.0.0
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp --jq 'flatten | any(.draft == false and .prerelease == false)')
          if [[ "$stable" == false ]]; then echo 'initial=1.0.0' >> "$GITHUB_OUTPUT"; fi

      - name: Update release draft
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          version: ${{ steps.version.outputs.initial }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
