name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Start the stable channel at 1.0.0
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate | jq -s 'flatten | any(.draft == false and .prerelease == false)')
          if [[ "$stable" == false ]]; then echo 'initial=1.0.0' >> "$GITHUB_OUTPUT"; fi

      - name: Update release draft
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        with:
          version: ${{ steps.version.outputs.initial }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
