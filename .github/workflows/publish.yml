name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      validate_only:
        description: Verify the selected release without NuGet login or push.
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      package_version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout workflow guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve package version from the release tag
        id: resolve
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = ./eng/Resolve-PublishVersion.ps1 -Tag $env:RELEASE_TAG -EventName $env:EVENT_NAME -Prerelease:($env:PRERELEASE -eq 'true')
          "version=$version" >> $env:GITHUB_OUTPUT

  verify:
    needs: version
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/_run-tests.yml
    with:
      checkout_ref: ${{ github.event.release.tag_name || inputs.tag }}
      package_version: ${{ needs.version.outputs.package_version }}
      release_ready: true

  publish:
    needs: [version, verify]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
    steps:
      - name: Checkout artifact guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the exact verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playbook-package
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.403

      - name: Check package identity and hash before publishing
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
        run: |
          $identity = ./eng/Assert-PublishPackage.ps1 -Artifacts ./artifacts -PackageVersion $env:PACKAGE_VERSION
          $identity
          $identity >> $env:GITHUB_STEP_SUMMARY

      - name: NuGet login (OIDC to temporary API key)
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the verified artifact without repacking
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/PinguApps.Playbook.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
