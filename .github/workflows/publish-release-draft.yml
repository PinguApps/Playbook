name: Publish Release Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0' # Sunday 18:17 UTC; activation remains an owner decision.

permissions:
  contents: write

concurrency:
  group: publish-release-draft
  cancel-in-progress: false

jobs:
  publish_draft:
    if: vars.ENABLE_WEEKLY_PUBLISH == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Publish a stable draft when main has new commits
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          $releases = @($pages | ForEach-Object { $_ })
          $draft = ./eng/Select-WeeklyRelease.ps1 -Releases $releases -Repository .
          if (-not $draft) { exit 0 }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)" -F draft=false --jq .html_url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish draft.' }
          "tag=$($draft.tag_name)" >> $env:GITHUB_OUTPUT

  publish_packages:
    needs: publish_draft
    if: needs.publish_draft.outputs.tag != ''
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.publish_draft.outputs.tag }}
    secrets: inherit
