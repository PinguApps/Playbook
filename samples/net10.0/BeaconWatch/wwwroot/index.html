<!DOCTYPE html>
<html lang="en">
<head>

  <base href="/">
  <title>Westmere beacon watch</title>
  <style>
body { margin: 2rem auto; max-width: 46rem; font: 1rem/1.5 system-ui; color: #183844; background: #f1f6f7; }
button { padding: .6rem 1rem; margin: .5rem; }

    <output id="lifetime">Starting</output>
