<!doctype html><html lang="en"><meta charset="utf-8"><title>Marsh survey</title>
<button id="record">Record count</button><output id="result"></output>
<script src="_framework/hybridwebview.js"></script>
<script>
document.getElementById('record').onclick = async () => {
  try {
    const receipt = await window.HybridWebView.InvokeDotNet('Record', [{ Station: 'Reedbank', Birds: 4 }]);
    document.getElementById('result').textContent = JSON.stringify(receipt);
  } catch (error) { document.getElementById('result').textContent = String(error); }
};
</script></html>
